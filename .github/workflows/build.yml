name: build
on:
  push:
    branches: ['**']
  workflow_dispatch:
  # Releases:
  # - a push to main whose VERSION file has no release yet creates release v<VERSION>;
  # - publishing a release on GitHub (tag like v1.2.3) also builds and attaches the files.
  release:
    types: [published]

# Default: the token can only read. Only the release job below may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved to other code);
      # Dependabot keeps these up to date (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Decide the version and whether this run makes a release:
      # - published release v1.2.3                     -> 1.2.3, attach files to it
      # - push to main, no release yet for VERSION      -> VERSION, create release v<VERSION>
      # - anything else                                 -> 0.0.<run number>, build only
      - id: version
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN: ${{ github.run_number }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $tag = ''
          if ($env:EVENT -eq 'release') {
            if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Release tag '$env:TAG' must look like v1.2.3" }
            $v = $Matches[1]; $tag = $env:TAG
          } else {
            $v = "0.0.$env:RUN"
            $file = (Get-Content VERSION -Raw).Trim()
            if ($file -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must look like 1.2.3, got '$file'" }
            if ($env:EVENT -eq 'push' -and $env:REF -eq 'refs/heads/main') {
              $exists = git ls-remote --tags $env:REPO_URL "refs/tags/v$file"
              if (-not $exists) { $v = $file; $tag = "v$file" }
            }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v  Release: $(if ($tag) { $tag } else { '<none>' })"

      - run: cmake -B build -A x64
      - run: cmake --build build --config Release

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\MoonlightUnlock.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      # Zip for manual installs: the DLL plus the scripts and README in one flat folder,
      # so install.ps1 finds MoonlightUnlockCP.dll and lock-watcher.ps1 next to itself.
      - name: Build zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item build/Release/MoonlightUnlockCP.dll, install.ps1, setup.ps1, uninstall.ps1, lock-watcher.ps1, README.md package/
          Compress-Archive -Path package/* -DestinationPath "dist/MoonlightUnlock-${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MoonlightUnlock
          path: dist/*

  release:
    if: needs.build.outputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to attach files to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MoonlightUnlock
          path: dist
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}  # creates the tag on this commit if needed
          name: Moonlight Unlock ${{ needs.build.outputs.release_tag }}
          generate_release_notes: true
          files: dist/*
