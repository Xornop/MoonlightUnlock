name: build
on:
  push:
    branches: ['**']
  workflow_dispatch:
  # Publishing a release on GitHub (with a tag like v1.0.0) builds the installer
  # and the zip from that tag and attaches both to the release.
  release:
    types: [published]

# Default: the token can only read. Only the release job below may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved to other code);
      # Dependabot keeps these up to date (.github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Release v1.2.3 -> version 1.2.3; any other build -> 0.0.<run number>
      - id: version
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
          RUN: ${{ github.run_number }}
        run: |
          if ($env:TAG) {
            if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Release tag '$env:TAG' must look like v1.2.3" }
            $v = $Matches[1]
          } else {
            $v = "0.0.$env:RUN"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - run: cmake -B build -A x64
      - run: cmake --build build --config Release

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\MoonlightUnlock.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      # Zip for manual installs: the DLL plus the scripts and README in one flat folder,
      # so install.ps1 finds MoonlightUnlockCP.dll and lock-watcher.ps1 next to itself.
      - name: Build zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item build/Release/MoonlightUnlockCP.dll, install.ps1, setup.ps1, uninstall.ps1, lock-watcher.ps1, README.md package/
          Compress-Archive -Path package/* -DestinationPath "dist/MoonlightUnlock-${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MoonlightUnlock
          path: dist/*

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to attach files to the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MoonlightUnlock
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
