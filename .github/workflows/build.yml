name: build
on:
  push:
  workflow_dispatch:

# The token can only read; this workflow only builds and uploads an artifact.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved to other code);
      # Dependabot keeps these up to date (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake -B build -A x64
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MoonlightUnlockCP
          path: build/Release/MoonlightUnlockCP.dll
